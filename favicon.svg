<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile-c" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19e0ff"/>
      <stop offset="100%" stop-color="#0fa9ce"/>
    </linearGradient>
    <linearGradient id="tile-l" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b6ff4d"/>
      <stop offset="100%" stop-color="#7fc500"/>
    </linearGradient>
    <linearGradient id="tile-p" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d9d"/>
      <stop offset="100%" stop-color="#d12d78"/>
    </linearGradient>
    <linearGradient id="tile-g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffcb47"/>
      <stop offset="100%" stop-color="#e0a020"/>
    </linearGradient>
    <radialGradient id="shield-glow" cx="16" cy="16" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19e0ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#19e0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#070b1e"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#3a4ba1" stroke-opacity=".6"/>

  <!-- Windows 4-tile logo -->
  <rect x="5" y="5" width="9.5" height="9.5" rx="1" fill="url(#tile-c)"/>
  <rect x="17.5" y="5" width="9.5" height="9.5" rx="1" fill="url(#tile-l)"/>
  <rect x="5" y="17.5" width="9.5" height="9.5" rx="1" fill="url(#tile-p)"/>
  <rect x="17.5" y="17.5" width="9.5" height="9.5" rx="1" fill="url(#tile-g)"/>

  <!-- Central shield glow -->
  <circle cx="16" cy="16" r="10" fill="url(#shield-glow)"/>

  <!-- VPN shield -->
  <path d="M16 9.5 L21 11.2 L21 15.5 C21 18.4 18.4 20.5 16 21.4 C13.6 20.5 11 18.4 11 15.5 L11 11.2 Z"
        fill="#070b1e" stroke="#19e0ff" stroke-width="1.2"/>
  <path d="M13.4 15.5 L15.2 17.3 L18.6 13.4" stroke="#b6ff4d" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
